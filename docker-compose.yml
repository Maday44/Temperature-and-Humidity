version: '3.8'

services:
  flask:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/code
      - sqlite_data:/code/instance
    environment:
      - FLASK_ENV=development
      - FLASK_RUN_HOST=0.0.0.0
      - SQLALCHEMY_DATABASE_URI=sqlite:////code/instance/sensor_data.db
    restart: unless-stopped

volumes:
  sqlite_data: